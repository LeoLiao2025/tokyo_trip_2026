<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京年末行程</title>
<meta name="description" content="2026/12/29–12/31 東京逛街行程：路線地圖、每日時間表、行李與待辦清單。">
<meta name="theme-color" content="#F6F7F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="東京行程">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232C4C7C'/%3E%3Ccircle cx='16' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M16 20v6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one column, station-signage style. Opens on a real OpenStreetMap route map; day tabs switch to timeline lists. Light only. */
:root{
  color-scheme: light;
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --ink:#1D2430;
  --muted:#5E6878;
  --faint:#8A93A3;
  --line:#E3E6EC;
  --accent:#2C4C7C;
  --accent-soft:#EAF0F8;
  --warn:#9A5B00;
  --warn-soft:#FFF4E2;
  --ok:#2F7A4F;
  --ok-soft:#E8F4EC;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1100;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto}
header.top{padding-block:24px 14px;display:grid;gap:8px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-size:26px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.fact{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}
.fact b{color:var(--ink);font-weight:500}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:1050;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer;display:grid;line-height:1.25;text-align:left}
.tab small{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:#D6E0EE}
.tab .today{display:inline-block;margin-left:4px;font-size:10px;padding:0 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dayhead{display:grid;gap:6px;margin-bottom:16px}
.dayhead h2{margin:0;font-size:22px;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.alerts{display:grid;gap:6px;margin-bottom:18px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.backmap{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;width:max-content}

ol.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:48px 18px minmax(0,1fr);column-gap:8px}
.row.flash .card{box-shadow:0 0 0 2px var(--accent)}
.time{font-family:var(--font-mono);font-size:13px;color:var(--muted);padding-top:14px;text-align:right;font-variant-numeric:tabular-nums}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.row:first-child .rail::before{top:18px}
.row:last-child .rail::before{bottom:calc(100% - 22px)}
.dot{position:absolute;left:3px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--dc,var(--accent))}
.row.done .dot{background:var(--ok);border-color:var(--ok)}
.row.move .dot{width:8px;height:8px;left:5px;top:20px;border:none;background:var(--faint)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-block:6px;display:grid;gap:6px;transition:box-shadow .3s}
.row.done .card{opacity:.6}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead h3{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;flex:none;padding-top:2px}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.pill{border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.card ul li+li{margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px}
.links a,.links button{font:inherit;font-size:13px;color:var(--accent);text-decoration:none;border:0;border-bottom:1px solid currentColor;background:none;padding:0;cursor:pointer}

.leg{padding-block:8px;display:grid;gap:4px}
.legline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px}
.ln{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 8px 2px 4px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.ln::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.arrow{color:var(--faint)}
.legdur{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
details.tip{font-size:13px;color:var(--muted)}
details.tip summary{cursor:pointer;color:var(--accent);width:max-content}
details.tip ul{margin:4px 0 0;padding-left:18px}

section.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
section.block h3{margin:0;font-size:17px}
section.block > p{margin:0;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.todos{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.todo{display:grid;grid-template-columns:22px 118px minmax(0,1fr);gap:10px;align-items:start;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.todo input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ok)}
.todo .when{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.todo .when.hot{color:var(--warn);font-weight:500}
.todo .what{font-size:14px}
.todo .what small{display:block;color:var(--muted);font-size:12.5px}
.todo.checked .what{color:var(--faint);text-decoration:line-through}
@media (max-width:520px){.todo{grid-template-columns:22px minmax(0,1fr)}.todo .when,.todo .what{grid-column:2}}

.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.place{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.place h4{margin:0;font-size:14.5px}
.place .area{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.place p{margin:0;font-size:13px;color:var(--muted)}
.place .addr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.copy{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:6px;padding:0 6px;cursor:pointer}
.place a{font-size:12.5px;color:var(--accent)}

/* ---------- map ---------- */
.maphead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:10px}
.maphead h2{margin:0;font-size:20px}
.maphead p{margin:0;color:var(--muted);font-size:13px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#E9ECEF}
#map{height:clamp(380px,64vh,660px);height:clamp(380px,64svh,660px);width:100%;font-family:var(--font-body)}
.legend{position:absolute;left:10px;top:10px;z-index:900;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 64px)}
.lg{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;background:rgba(255,255,255,.96);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,50,.12)}
.lg::before{content:"";width:18px;height:4px;border-radius:2px;background:var(--c)}
.lg:hover{border-color:var(--c)}
.mctl{display:grid;gap:6px}
.mctl button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:500 18px/1 var(--font-body);cursor:pointer;box-shadow:0 1px 3px rgba(20,30,50,.15);padding:0}
.mctl button.txt{font-size:11.5px;letter-spacing:.02em}
.mctl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.leaflet-container{background:#E9ECEF}.leaflet-control-attribution{font-size:10.5px}
.route{transition:opacity .2s}
.mapbox.focus .route{opacity:.12}
.mapbox.focus .route.on{opacity:1}
.mk{background:none;border:0}
.mk .pin{position:absolute;border-radius:50%;box-shadow:0 0 0 2px #fff,0 1px 5px rgba(20,30,50,.35)}
.mk.main .pin::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#fff}
.mk.node .pin{background:#fff!important;box-shadow:0 0 0 1.5px #7C8696}
.mk .lbl{position:absolute;top:-10px;white-space:nowrap;font:500 12px/18px var(--font-body);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink);pointer-events:auto}
.mk.node .lbl{background:none;border:0;font-size:11px;font-weight:400;color:var(--muted);padding:0 2px}
.mk.shop .lbl{font-size:11.5px}
.mk .lbl.hide{visibility:hidden}
.mk.sel .pin{box-shadow:0 0 0 3px var(--ink),0 1px 6px rgba(20,30,50,.4)}
.mk.sel .lbl{visibility:visible;border-color:var(--ink)}
.mapbox.focus .mk.dim{opacity:.25}
.mapbox.zhi .mk.grp,.mapbox:not(.zhi) .mk.shop{display:none}
.mapbox:not(.zmid) .mk.node{display:none}
.me{width:14px;height:14px;border-radius:50%;background:#1A73E8;box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(26,115,232,.25)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 18px rgba(20,30,50,.18)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--font-body);font-size:14px;line-height:1.5;min-width:220px}
.pop{display:grid;gap:8px}
.pop b{font-size:15px}
.pop .psub{font-size:12px;color:var(--muted);margin-top:-6px}
.pvisits{display:grid;gap:6px}
.visit{display:grid;grid-template-columns:auto 44px minmax(0,1fr);align-items:center;gap:8px;font:inherit;font-size:13px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.visit:hover{border-color:var(--accent)}
.vday{font-size:11.5px;font-weight:500;color:#fff;background:var(--dc);border-radius:5px;padding:1px 6px}
.visit .mono{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plinks{display:flex;flex-wrap:wrap;gap:6px}
.plinks a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.plinks a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mapnote{font-size:12px;color:var(--faint);margin:8px 0 14px}
.farrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:13px;color:var(--muted)}
.far{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.far:hover{border-color:var(--accent)}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.daycard{display:grid;gap:4px;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--dc);border-radius:12px;padding:12px 14px;cursor:pointer}
.daycard:hover{border-color:var(--dc)}
.daycard .d{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.daycard b{font-size:15px;line-height:1.4}
.daycard span.s{font-size:13px;color:var(--muted)}
.daycard span.go{font-size:13px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;font-size:13.5px;padding:8px 14px;border-radius:10px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.foot{color:var(--faint);font-size:12px;margin-top:24px}
.maperr{padding:24px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">2026.12.29 – 12.31 · Tokyo</div>
    <h1>東京年末行程</h1>
    <p class="sub">三天逛街，12/31 晚上搭上越新幹線前往越後湯澤。</p>
    <div class="facts">
      <span class="fact">住宿 <b>AKABANEHOLIC HOTEL</b>（赤羽）</span>
      <span class="fact">行李 <b>29 吋 × 3</b></span>
      <span class="fact">成田第 2 航廈抵達 <b>12:35</b></span>
    </div>
  </header>

  <nav class="tabs" aria-label="切換頁面">
    <div class="tabrow" role="tablist" id="tabrow"></div>
  </nav>

  <main id="view"></main>
  <p class="foot">勾選狀態只存在這支手機（或這台電腦）的瀏覽器裡。營業時間與票價以 2026 年 11 月查詢結果為準，出發前請再確認。底圖：國土地理院（地理院タイル）。</p>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const C = { sky:'#1E5BA8', keihin:'#00B2E5', yuri:'#1A8FB5', rinkai:'#00418E', saikyo:'#00AC9A',
  hibiya:'#9C9E9A', marunouchi:'#F62E36', ginza:'#FF9500', yamanote:'#80C241', denen:'#20A288', joetsu:'#E85298', walk:'#B9C0CC' };
const DC = { d29:'#2C6FBF', d30:'#D27326', d31:'#2E8B57' };
const gm = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const nav = ll => `https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}&travelmode=transit`;

const DAYS = [
 { id:'d29', date:'2026-12-29', tab:'12/29', dow:'週二', title:'成田 → 台場 → 雪具街初逛', short:'成田 → 台場 → 神田小川町',
   lead:'機場直接帶行李去台場，逛完回赤羽 check-in，晚上先去神田小川町看貨比價。',
   route:['narita','nippori','shimbashi','divercity','akabane','ogawamachi','akabane'],
   alerts:[
     {t:'DiverCity 與雪具街多數店家平日 20:00 關門。'},
     {t:'Skyliner 線上票要在出發前一天以前買，到成田再換成實體票並劃位。', info:true}
   ],
   items:[
    {type:'stop', t:'12:35', mp:'narita', title:'抵達成田機場第 2 航廈', dur:'約 1h 出關',
      notes:['出關後到 Skyliner 櫃台或售票機，把線上票 QR Code 換成實體票','選最近一班，車上有大型行李放置區']},
    {type:'move', t:'13:50', end:'14:30', legs:[['Skyliner',C.sky]], from:'空港第2ビル', to:'日暮里', dur:'約 40 分',
      tips:['第 2 航廈下機，車站是「空港第2ビル」站，就在航廈地下 1 樓',
            '入境大廳（1 樓）出來後，正前方的手扶梯往下到地下 1 樓就是車站，南北兩側出口都一樣',
            '背對航廈時，前面是 JR 閘門、後面是京成閘門；京成售票處（Ticket center）和 Skyliner 售票機在京成閘門旁（2024 年筆記：在全家便利商店後面）',
            '幾班飛機同時抵達時售票機會排隊，線上票換票要預留時間',
            '在售票機掃描線上票的 QR Code 換票並選座位；第一排或最後一排靠近行李放置區',
            '線上票已含車資：換出的票若是 2 張（乘車券＋Skyliner 券），疊在一起插入閘門；只有 1 張就直接插入。京成這段不用刷 Suica',
            '萬一換出的票只有 Skyliner 券（沒有乘車券），代表車資要另付：先插票、再刷 Suica，不確定就問站務員',
            'Skyliner 往上野方向在「1 號月台」（成田スカイアクセス線）；3 號月台是京成本線的一般列車，不要搭錯',
            '另有「Face Check in Go」臉部辨識可以免換票，但不能自己選座位，所以這趟用 QR 換票就好',
            '每班 Skyliner 都停日暮里；線上票 2,310 日圓（現場 2,580 日圓），購買後 6 個月內有效，最晚前一天要買好']},
    {type:'move', t:'14:35', end:'14:55', legs:[['JR 山手線（外回り）',C.yamanote]], from:'日暮里', to:'新橋', dur:'約 20 分',
      tips:['下車後跟著綠色 JR 指標走「京成線のりかえ口」，不用出站，走到 JR 月台約 1 分鐘，沒有樓梯',
            '過閘門的順序：先插入京成車票（機器會收走），再刷 Suica。順序反過來可能算錯車資',

const VISITS = {};
DAYS.forEach(d => d.items.forEach((it,i) => {
  if(!it.mp) return;
  [].concat(it.mp).forEach(mp => (VISITS[mp] = VISITS[mp] || []).push({day:d.id, tab:d.tab, t:it.t, title:it.title, key:`${d.id}:${i}`}));
}));
const visitsFor = id => VISITS[id] || VISITS[PTS[id].g] || [];
const daysFor = id => {
  const s = new Set(visitsFor(id).map(v=>v.day));
  DAYS.forEach(d => { if(d.route.includes(id)) s.add(d.id); });
  return [...s].sort();
};

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.hidden = true; }, 3200);
}

function renderTabs(cur){
  document.getElementById('tabrow').innerHTML = TABS.map(t =>
    `<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${t.id===cur}" data-tab="${t.id}">${esc(t.label)}${t.today?'<span class="today">今天</span>':''}<small>${esc(t.sub)}</small></button>`).join('');
  const el = document.getElementById('tab-'+cur);
  if(el && el.scrollIntoView) el.scrollIntoView({inline:'nearest', block:'nearest'});
}

  const rows = d.items.map((it,i) => {
    const key = `${d.id}:${i}`;
    const mps = it.mp ? [].concat(it.mp) : [];
    if(it.type==='move'){
      const legs = it.legs.map(l=>`<span class="ln" style="--c:${l[1]}">${esc(l[0])}</span>`).join('<span class="arrow">→</span>');
      const tips = it.tips ? `<details class="tip"><summary>轉乘提醒</summary><ul>${it.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>` : '';
      return `<li class="row move" data-key="${key}"><div class="time">${it.t}</div><div class="rail"><span class="dot"></span></div>
        <div class="leg"><div class="legline">${esc(it.from)} <span class="arrow">→</span> ${esc(it.to)} <span class="legdur">${it.t}–${it.end}・${esc(it.dur)}</span></div>
        <div class="legline">${legs}</div>${tips}</div></li>`;
    }
    const done = store.get('done:'+key,false);
    const tags = [[ '停留 '+it.dur, '' ], ...(it.tags||[])].map(t=>`<span class="pill ${t[1]}">${esc(t[0])}</span>`).join('');
    const notes = it.notes ? `<ul>${it.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
    const links = [];
    if(mps.length){
      const p = PTS[mps[mps.length-1]];
      links.push(`<button data-onmap="${mps[0]}">在行程地圖上看</button>`);
      links.push(`<a href="${gm(p.gq)}" target="_blank" rel="noopener">Google 地圖</a>`);
      links.push(`<a href="${nav(p.ll)}" target="_blank" rel="noopener">導航</a>`);
    }
    return `<li class="row stop${done?' done':''}" data-key="${key}" style="--dc:${DC[d.id]}"><div class="time">${it.t}</div><div class="rail"><span class="dot"></span></div>
      <div class="card"><div class="chead"><h3>${esc(it.title)}</h3>
      <label class="chk"><input type="checkbox" id="c-${key.replace(':','-')}" ${done?'checked':''} data-done="${key}"><span>完成</span></label></div>
      <div class="meta">${tags}</div>${notes}${links.length?`<div class="links">${links.join('')}</div>`:''}</div></li>`;
  }).join('');
  return `<div class="dayhead"><button class="backmap" data-tab="map">← 回到地圖</button><div class="eyebrow">${esc(d.tab)} ${esc(d.dow)}</div><h2>${esc(d.title)}</h2><p>${esc(d.lead)}</p>
    <div class="progress"><span id="prog-txt"></span><div class="bar"><i id="prog-bar"></i></div></div></div>
    <div class="alerts">${d.alerts.map(a=>`<div class="alert${a.info?' info':''}">${esc(a.t)}</div>`).join('')}</div>
    <ol class="tl">${rows}</ol>`;
}

function prepHTML(){
  const lug = LUGGAGE.map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="mono">${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('');
  const todos = TODOS.map(t=>{
    const c = t.done || store.get('todo:'+t.id,false);
    return `<li><label class="todo${c?' checked':''}"><input type="checkbox" id="t-${t.id}" data-todo="${t.id}" ${c?'checked':''} ${t.done?'disabled':''}>
      <span class="when${t.hot?' hot':''}">${esc(t.when)}</span><span class="what">${esc(t.what)}${t.sub?`<small>${esc(t.sub)}</small>`:''}</span></label></li>`;
  }).join('');
  const places = PLACES.map(p=>`<div class="place"><span class="area">${esc(p.area)}</span><h4>${esc(p.name)}</h4>
    ${p.addr?`<div class="addr"><p>${esc(p.addr)}</p><button class="copy" data-copy="${esc(p.addr)}">複製</button></div>`:''}
    ${p.info?`<p>${esc(p.info)}</p>`:''}
    ${p.tel?`<p>電話 <a href="tel:+81${p.tel.replace(/^0/,'').replace(/-/g,'')}">${esc(p.tel)}</a></p>`:''}
    <a href="${gm(p.q)}" target="_blank" rel="noopener">Google 地圖</a></div>`).join('');
  return `<div class="dayhead"><div class="eyebrow">出發前</div><h2>行李、待辦與店家</h2><p>三件 29 吋行李的去向、出發前要完成的預約，以及各點的地址。</p></div>
    <section class="block"><h3>待辦清單</h3><p>時間都是台灣時間。橘色是有固定開賣時間的項目。</p><ul class="todos">${todos}</ul></section>
    <section class="block"><h3>12/31 行李安排</h3>
      <div class="tablewrap"><table><thead><tr><th>行李</th><th>用途</th><th>寄放處</th><th>時間</th><th>費用</th></tr></thead><tbody>${lug}</tbody></table></div>
      <p>1/3 回飯店時出示那筆訂房的確認編號領回 A。車站置物櫃最多放 3 天，所以 A 不放車站。</p></section>
    <section class="block"><h3>店家與地址</h3><p>地址可以複製給計程車司機或貼到地圖；電話在手機上可以直接撥打。</p><div class="places">${places}</div></section>`;
}

function updateProgress(){
  const boxes = document.querySelectorAll('[data-done]');
  const n = [...boxes].filter(b=>b.checked).length;
  const txt = document.getElementById('prog-txt'), bar = document.getElementById('prog-bar');
  if(txt){ txt.textContent = `已完成 ${n} / ${boxes.length} 站`; bar.style.width = (boxes.length? n/boxes.length*100 : 0)+'%'; }
}

/* ---------------- map ---------------- */
function mapHTML(){
  const legend = DAYS.map(d=>`<button class="lg" style="--c:${DC[d.id]}" data-tab="${d.id}" data-hl="${d.id}">${d.tab} ${d.dow}</button>`).join('');
  const cards = DAYS.map(d=>{
    const n = d.items.filter(i=>i.type==='stop').length;
    return `<button class="daycard" style="--dc:${DC[d.id]}" data-tab="${d.id}" data-hl="${d.id}"><span class="d">${d.tab} ${d.dow}・${n} 站</span><b>${esc(d.short)}</b><span class="s">${esc(d.lead)}</span><span class="go">看當天行程 →</span></button>`;
  }).join('');
  const fars = [['narita','成田機場'],['snoopy','史努比博物館'],['omiya','大宮'],['yuzawa','越後湯澤・Mori']]
    .map(f=>`<button class="far" data-fly="${f[0]}">${f[1]}</button>`).join('');
  return `<div class="maphead"><h2>三天路線</h2><p>雙指縮放、拖曳移動；點地點看當天安排與導航。</p></div>
    <div class="mapbox" id="mapbox">
      <div id="map" role="application" aria-label="行程地圖"></div>
      <div class="legend">${legend}</div>
    </div>
    <p class="mapnote">彩色線是每天移動的順序（直線示意，不是實際路線）；虛線是長距離移動。放大到街道層級會顯示雪具街、銀座、表參道的每一家店。</p>
    <div class="farrow">遠方地點：${fars}</div>
    <div class="daycards">${cards}</div>`;
}

let MAP = null, lastView = null, pendingSelect = null, baseDetail = store.get('base', false);

function initMap(){
  const box = document.getElementById('mapbox');
  if(typeof L === 'undefined'){
    document.getElementById('map').innerHTML = '<div class="maperr">地圖元件載入失敗，請確認網路連線後重新整理。下方的每日行程仍可使用。</div>';
    return;
  }
  const map = L.map('map', { zoomControl:false, attributionControl:true, tap:true, zoomSnap:0.5, worldCopyJump:false });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  /* GSI (Geospatial Information Authority of Japan) tiles: free, no API key. "pale" = light map, "std" = standard map. */
  const gsiAttr = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  const light = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { minZoom:5, maxNativeZoom:18, maxZoom:19, attribution:gsiAttr });
  const detail = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { minZoom:5, maxNativeZoom:18, maxZoom:19, attribution:gsiAttr });
  if(lastView) map.setView(lastView.c, lastView.z, {animate:false});
  else map.fitBounds(L.latLngBounds(CITY.map(id=>PTS[id].ll)), { paddingTopLeft:[20,64], paddingBottomRight:[60,24] });
  (baseDetail ? detail : light).addTo(map);

  const m = { map, box, markers:[], routes:{}, me:null };
  MAP = m;

  // routes
  DAYS.forEach(d => {
    for(let i=0;i<d.route.length-1;i++){
      const a = PTS[d.route[i]], b = PTS[d.route[i+1]];
      const far = a.far || b.far;
      const line = L.polyline([a.ll, b.ll], { color:DC[d.id], weight:4, opacity:.85, dashArray: far ? '7 7' : null, className:'route', interactive:false }).addTo(map);
      (m.routes[d.id] = m.routes[d.id] || []).push(line);
    }
  });

  // markers
  const R = {main:9, grp:9, shop:7, node:4};
  Object.entries(PTS).forEach(([id,p]) => {
    const days = daysFor(id);
    const cols = days.map(d=>DC[d]);
    const bg = !cols.length ? '#fff' : cols.length>1 ? `conic-gradient(${cols.map((c,i)=>`${c} ${i/cols.length*360}deg ${(i+1)/cols.length*360}deg`).join(',')})` : cols[0];
    const r = R[p.kind];
    const kindCls = p.kind==='grp' ? 'main grp' : p.kind;
    const icon = L.divIcon({ className:'mk '+kindCls, iconSize:[0,0], iconAnchor:[0,0],
      html:`<span class="pin" style="left:${-r}px;top:${-r}px;width:${2*r}px;height:${2*r}px;background:${bg}"></span><span class="lbl" style="left:${r+4}px">${esc(p.name)}</span>` });
    const mk = L.marker(p.ll, { icon, keyboard:true, title:p.name, riseOnHover:true, zIndexOffset: p.kind==='node'?-500:(p.kind==='shop'?200:0) }).addTo(map);
    const k = { id, p, mk, r, days, kind:p.kind, el:null, lbl:null, lw:0 };
    mk.bindPopup(() => popupHTML(id), { maxWidth:280, autoPanPadding:[20,60], closeButton:true });
    mk.on('popupopen', e => { setSel(id); wirePopup(e.popup); });
    mk.on('popupclose', () => { if(m.sel===id) setSel(null); });
    m.markers.push(k);
  });
  m.markers.forEach(k => { k.el = k.mk.getElement(); k.lbl = k.el.querySelector('.lbl'); });

  // controls
  const Ctl = L.Control.extend({ options:{position:'topright'}, onAdd(){
    const div = L.DomUtil.create('div','mctl');
    div.innerHTML = `<button data-c="in" aria-label="放大">+</button><button data-c="out" aria-label="縮小">−</button>
      <button class="txt" data-c="city">市區</button><button class="txt" data-c="all">全覽</button>
      <button class="txt" data-c="me">定位</button><button class="txt${baseDetail?' on':''}" data-c="base" aria-pressed="${baseDetail}">詳細</button>`;
    L.DomEvent.disableClickPropagation(div); L.DomEvent.disableScrollPropagation(div);
    div.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      const c = b.dataset.c;
      if(c==='in') map.zoomIn(); else if(c==='out') map.zoomOut();
      else if(c==='city') fitIds(CITY); else if(c==='all') fitIds(ALL);
      else if(c==='me') map.locate({ setView:true, maxZoom:16, enableHighAccuracy:true });
      else if(c==='base'){
        baseDetail = !baseDetail; store.set('base', baseDetail);
        if(baseDetail){ map.removeLayer(light); detail.addTo(map); } else { map.removeLayer(detail); light.addTo(map); }
        b.classList.toggle('on', baseDetail); b.setAttribute('aria-pressed', baseDetail);
      }
    });
    return div;
  }});
  new Ctl().addTo(map);

  map.on('locationfound', e => {
    if(m.me){ m.me.setLatLng(e.latlng); m.meAcc.setLatLng(e.latlng).setRadius(e.accuracy); }
    else {
      m.meAcc = L.circle(e.latlng, { radius:e.accuracy, color:'#1A73E8', weight:1, fillOpacity:.08, interactive:false }).addTo(map);
      m.me = L.marker(e.latlng, { icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[14,14]}), zIndexOffset:1000, title:'你的位置' }).addTo(map);
    }
  });
  map.on('locationerror', () => toast('無法取得位置：請允許瀏覽器使用定位後再試一次。'));

  function fitIds(ids, opts){
    const b = L.latLngBounds(ids.map(id=>PTS[id].ll));
    map.flyToBounds(b, Object.assign({ paddingTopLeft:[20,64], paddingBottomRight:[60,24], duration: reduceMotion?0:.6 }, opts||{}));
  }
  m.fitIds = fitIds;

  map.on('zoomend moveend', () => { declutter(); lastView = { c:map.getCenter(), z:map.getZoom() }; });
  declutter();

  if(pendingSelect){ const id = pendingSelect; pendingSelect = null; setTimeout(()=>focusPoint(id), 50); }
}

function declutter(){
  const m = MAP; if(!m) return;
  const map = m.map, z = map.getZoom(), size = map.getSize();
  m.box.classList.toggle('zhi', z >= 15);
  m.box.classList.toggle('zmid', z >= 12.5);
  const visible = k => k.kind==='grp' ? z < 15 : k.kind==='shop' ? z >= 15 : k.kind==='node' ? z >= 12.5 : true;
  const prio = k => (k.id===m.sel?100:0) + ({main:3, grp:3, shop:2, node:1}[k.kind]);
  const list = m.markers.filter(visible).sort((a,b)=>prio(b)-prio(a));
  const placed = [];
  const hit = r => placed.some(q => r.x < q.x+q.w && r.x+r.w > q.x && r.y < q.y+q.h && r.y+r.h > q.y);
  list.forEach(k => { k.pt = map.latLngToContainerPoint(k.p.ll); placed.push({x:k.pt.x-k.r, y:k.pt.y-k.r, w:2*k.r, h:2*k.r}); });
  list.forEach(k => {
    if(!k.lw) k.lw = k.lbl.offsetWidth || 90;
    const right = { x:k.pt.x+k.r+4, y:k.pt.y-10, w:k.lw, h:20 };
    const left = { x:k.pt.x-k.r-4-k.lw, y:k.pt.y-10, w:k.lw, h:20 };
    const inView = k.pt.x > -k.lw-20 && k.pt.x < size.x+k.lw && k.pt.y > -20 && k.pt.y < size.y+20;
    let r = null;
    if(inView){
      const rightFits = right.x + right.w < size.x - 52 || k.pt.y > 300;
      if(k.id===m.sel || (!hit(right) && rightFits)) r = right;
      else if(!hit(left) && left.x > 0) r = left;
    }
    if(r === left){ k.lbl.style.left = 'auto'; k.lbl.style.right = (k.r+4)+'px'; }
    else { k.lbl.style.right = 'auto'; k.lbl.style.left = (k.r+4)+'px'; }
    k.lbl.classList.toggle('hide', !r);
    if(r) placed.push(r);
  });
}

function setSel(id){
  if(!MAP) return;
  MAP.sel = id;
  MAP.markers.forEach(k => k.el.classList.toggle('sel', k.id===id));
  declutter();
}

function popupHTML(id){
  const p = PTS[id];
  const vs = visitsFor(id);
  const sub = p.g ? PTS[p.g].name : (p.kind==='node' ? '轉乘站' : '');
  return `<div class="pop"><b>${esc(p.name)}</b>${sub?`<span class="psub">${esc(sub)}</span>`:''}
    ${vs.length?`<div class="pvisits">${vs.map(v=>`<button class="visit" style="--dc:${DC[v.day]}" data-goto="${v.key}"><span class="vday">${v.tab}</span><span class="mono">${v.t}</span><span>${esc(v.title)}</span></button>`).join('')}</div>`:''}
    <div class="plinks"><a class="pri" href="${nav(p.ll)}" target="_blank" rel="noopener">導航（大眾運輸）</a><a href="${gm(p.gq)}" target="_blank" rel="noopener">Google 地圖</a></div></div>`;
}
function wirePopup(popup){
  const el = popup.getElement(); if(!el) return;
  el.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.goto; go(key.split(':')[0], key);
  }));
}

function focusPoint(id){
  const m = MAP; if(!m) return;
  const p = PTS[id];
  const k = m.markers.find(x=>x.id===id);
  let z = p.kind==='grp' ? 16 : p.far ? 13 : 15.5;
  if(id==='yuzawa' || id==='mori'){
    m.map.flyToBounds(L.latLngBounds([PTS.yuzawa.ll, PTS.mori.ll]), { paddingTopLeft:[30,80], paddingBottomRight:[70,40], duration: reduceMotion?0:.8, maxZoom:13 });
  } else {
    m.map.flyTo(p.ll, z, { duration: reduceMotion?0:.8 });
  }
  m.map.once('moveend', () => { if(k) k.mk.openPopup(); });
}

function highlightDay(id){
  if(!MAP) return;
  MAP.box.classList.toggle('focus', !!id);
  Object.entries(MAP.routes).forEach(([d,ls]) => ls.forEach(l => { const e = l.getElement(); if(e) e.classList.toggle('on', d===id); }));
  MAP.markers.forEach(k => k.el.classList.toggle('dim', !!id && !k.days.includes(id)));
}

/* ---------------- routing ---------------- */
let pendingFocus = null;
function go(id, focusKey){
  pendingFocus = focusKey || null;
  if((location.hash.slice(1) || 'map') === id) render(id);
  else location.hash = id;
}
function render(id){
  if(!TABS.some(t=>t.id===id)) id = 'map';
  if(MAP){ MAP.map.remove(); MAP = null; }
  renderTabs(id);
  const view = document.getElementById('view');
  const d = DAYS.find(x=>x.id===id);
  if(id==='map'){ view.innerHTML = mapHTML(); initMap(); }
  else if(d){ view.innerHTML = dayHTML(d); updateProgress(); }
  else view.innerHTML = prepHTML();
  const fk = pendingFocus; pendingFocus = null;
  if(fk){
    requestAnimationFrame(() => {
      const row = document.querySelector(`[data-key="${fk}"]`);
      if(!row) return;
      row.scrollIntoView({block:'center', behavior: reduceMotion ? 'auto' : 'smooth'});
      row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'), 1800);
    });
  } else if(id !== 'map' || !pendingSelect) window.scrollTo({top:0});
}
window.addEventListener('hashchange', () => render(location.hash.slice(1) || 'map'));

document.addEventListener('click', e=>{
  const onmap = e.target.closest('[data-onmap]');
  if(onmap){ pendingSelect = onmap.dataset.onmap; go('map'); return; }
  const fly = e.target.closest('[data-fly]');
  if(fly){ document.getElementById('mapbox').scrollIntoView({block:'center', behavior: reduceMotion?'auto':'smooth'}); focusPoint(fly.dataset.fly); return; }
  const tab = e.target.closest('[data-tab]');
  if(tab){ go(tab.dataset.tab); return; }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const done = ()=>{ cp.textContent='已複製'; setTimeout(()=>cp.textContent='複製',1500); };
    try{ navigator.clipboard.writeText(cp.dataset.copy).then(done).catch(()=>sel(cp)); }catch(err){ sel(cp); }
  }
});
document.addEventListener('pointerover', e=>{ if(e.pointerType!=='mouse') return; const h = e.target.closest('[data-hl]'); if(h) highlightDay(h.dataset.hl); });
document.addEventListener('pointerout', e=>{ if(e.pointerType!=='mouse') return; const h = e.target.closest('[data-hl]'); if(h && !h.contains(e.relatedTarget)) highlightDay(null); });
function sel(btn){ const p = btn.previousElementSibling; const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='已選取'; }

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.done){
    store.set('done:'+t.dataset.done, t.checked);
    t.closest('.row').classList.toggle('done', t.checked);
    updateProgress();
  } else if(t.dataset.todo){
    store.set('todo:'+t.dataset.todo, t.checked);
    t.closest('.todo').classList.toggle('checked', t.checked);
  }
});

render(location.hash.slice(1) || 'map');
</script>
